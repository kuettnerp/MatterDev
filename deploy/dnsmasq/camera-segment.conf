# DHCP for the isolated camera segment on eth0 only.
#
# Install: sudo cp deploy/dnsmasq/camera-segment.conf /etc/dnsmasq.d/
#          sudo systemctl restart dnsmasq
#
# Assumes eth0 already has the static IP 192.168.50.1/24 (see docs/network-topology.md).
# NEVER remove `interface=eth0` / add `interface=wlan0` here - that would start
# handing out camera-segment leases on the home network side.

interface=eth0
bind-interfaces
except-interface=wlan0

dhcp-range=192.168.50.10,192.168.50.100,12h

# Add a `dhcp-host=` line per camera once identified via tools/discover_cameras.py,
# so each camera keeps a stable IP across reboots/DHCP renewals. Example:
# dhcp-host=aa:bb:cc:dd:ee:ff,192.168.50.10,front-door
